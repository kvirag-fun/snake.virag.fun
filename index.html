<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>The Snake Game</title>
    <link rel="icon" type="image/x-icon" href="tab_icon.ico?v=1">
    <style>
        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            height: auto;
            margin: 0;
            background: #1a1a2e;
            font-family: Arial, sans-serif;
            color: white;
            
            /* Disable native touch gestures (pan/zoom) so they don't
               compete with the swipe handling below - previously
               commented out, which let the browser's own gesture
               recognizer add its own latency/jank on top of the game's. */
            overflow: hidden;
            touch-action: none;
            overscroll-behavior: none;

        }
        canvas {
            border: 3px solid #16213e;
            border-radius: 10px;
            background: #0f3460;
            box-shadow: 0 0 20px rgba(0,255,255,0.3);
        }
        .score {
            font-size: 24px;
            margin: 20px 0;
            text-shadow: 0 0 10px #00ffff;
        }
        .controls {
            margin-top: 20px;
            text-align: center;
        }

		.flex-container {
  			touch-action: none;
		}

        .difficulty-selector {
            margin: 10px 0 10px 0;
            font-size: 14px;
            text-shadow: 0 0 5px #00ffff;
        }

        #difficultySelect:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        
        #difficultySelect {
            background: #16213e;
            color: #00ffff;
            border: 2px solid #00ffff;
            border-radius: 5px;
            padding: 5px;
            /* 16px is the minimum that keeps iOS Safari (and some Android
               browsers) from auto-zooming the viewport on focus - that
               auto-zoom isn't blocked by user-scalable=no (only manual
               pinch/double-tap zoom is), and it doesn't get undone by a
               reload since it's a browser viewport-zoom state, not page
               state - so once triggered, it's stuck zoomed in with no way
               back out. */
            font-size: 16px;
            cursor: pointer;
            box-shadow: 0 0 10px rgba(0,255,255,0.3);
        }
        
        #difficultySelect:hover {
            box-shadow: 0 0 20px rgba(0,255,255,0.6);
        }

        @media (max-width: 480px) {
            .score {
                display: flex !important;
                flex-wrap: nowrap !important;
            }
            
            .flex-container {
                gap: 5px !important;
                width: 95vw !important;
                justify-content: center !important;
            }
            
            .leaderboard, .settings { 
                width: 48% !important;
                font-size: 12px !important;
            }

            #topScoresList { font-size: 10px !important; }
            
            canvas { 
                width: 95vw !important; 
                height: 95vw !important; 
                max-width: 400px; 
                max-height: 400px; 
            }
        }
        
    </style>
</head>
<body>
    <audio id="gameOverSound" preload="auto">
        <source src="ugh_05s.mp3" type="audio/mpeg">
    </audio>
    <audio id="foodEatingSound" preload="auto">
        <source src="food.mp3" type="audio/mpeg">
    </audio>
    
    <div class="score">
        Score: <span id="score">0</span> | 
        Level: <span id="level">1</span>
    </div>

    <!-- Flexbox side-by-side -->
    <div class="flex-container" style="width: 100%; max-width: 400px; margin: 10px 0; display: flex; gap: 30px; align-items: flex-start">
        <!-- Leaderboard -->
        <div class="leaderboard" style="font-size: 14px; margin: 10px 0 10px 0; text-shadow: 0 0 5px #00ffff; line-height: 1.3em; text-align: left; width: 200px;">
            Top 5 - <span id="currentDifficulty">Viper</span>:<br>
            <div id="topScoresList" style="margin-top: 2px; font-size: 12px;">
                1. 0<br>2. 0<br>3. 0<br>4. 0<br>5. 0
            </div>
        </div>
    
        <!-- Settings -->
        <div class="settings" style="font-size: 14px; margin: 10px 0 10px 0; text-shadow: 0 0 5px #00ffff; line-height: 1.3em; text-align: left; width: 200px;">
            Settings:<br>
            <label style="font-size: 12px;">
                <input type="checkbox" id="soundToggle" style="cursor: pointer;"> Sound on
            </label>
            <div class="difficulty-selector" id="difficultySelector">
                <label>Difficulty: </label>
                <select id="difficultySelect">
                    <option value=0.00 selected>🐍 Viper</option>
                    <option value=0.25>⚡ Python</option>
                    <option value=0.50>💀 Anaconda</option>
                    <option value=1.00>🔥 King Cobra</option>
                </select>
            </div>
        </div>
    </div>
    
    <!-- Game canvas -->
    <canvas id="gameCanvas" width="400" height="400"></canvas>

    <div class="controls">
        <div>Use ARROW KEYS or SWIPE to move</div>
        <div id="gameOver" style="height: 30px; visibility: visible; color:#ff0000; font-size:20px;">
            Game Over! Double-tap or press R to restart.
        </div>
    </div>

    <div class="version">v<span id="version">0.3.38</span></div>
    
    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const scoreElement = document.getElementById('score');
        const levelElement = document.getElementById('level');
        const gameOverElement = document.getElementById('gameOver');
        const soundToggle = document.getElementById('soundToggle');
        const difficultySelect = document.getElementById('difficultySelect');

        difficultySelect.addEventListener('change', function() {
            if (!gameRunning) {
                this.blur();
                updateDifficultyDisplay();
                displayLeaderboard();
            }
        });
        
        // Game settings
        const gridSize = 20;
        const tileCount = canvas.width / gridSize;
        const difficultyCurve = [0, 20, 35, 50]

        let snake = [
            {x: 10, y: 10}
        ];
        
        let food = {};
        let badFood = {};
        let badFoodList = [];
        
        let dx = 0;
        let dy = 0;
        let score = 0;
        let gameRunning = false;
        let gameSpeed = 150;
        let gameInterval;

        // Input queue settings
        let inputQueue = []
        
        //Double tap settings
        let lastTap = 0;
        const doubleTapDelay = 300;

        let needsRedraw = true;
        let lastUpdateTime = 0

        //Handle splash screen image
        const splashImage = new Image();
        let splashLoaded = false;
        
        splashImage.onload = () => {
            splashLoaded = true;
        };
        splashImage.src = 'snake_splash_screen.png';
        
        function getDifficultyKey() {
            const difficultySelect = document.getElementById('difficultySelect');
            return `snakeTopScores_${difficultySelect.value}`;
        }

        function updateDifficultyDisplay() {
            const difficultySelect = document.getElementById('difficultySelect');
            const currentDifficulty = document.getElementById('currentDifficulty');
            const options = {
                '0.00': 'Viper 🐍',
                '0.25': 'Python ⚡', 
                '0.50': 'Anaconda 💀',
                '1.00': 'King Cobra 🔥'
            };
            currentDifficulty.textContent = options[difficultySelect.value] || 'Viper 🐍';
        }

        function toggleDifficultySelector() {
            if (gameRunning) {
                difficultySelect.disabled = true;
                difficultySelect.style.opacity = '0.5';
                difficultySelect.style.cursor = 'not-allowed';
            } else {
                difficultySelect.disabled = false;
                difficultySelect.style.opacity = '1';
                difficultySelect.style.cursor = 'pointer';
            }
        }

        // Leaderboard management
        function getLeaderboard() {
            const key = getDifficultyKey();
            const scores = localStorage.getItem(key);
            return scores ? JSON.parse(scores) : [];
        }
        
        function updateLeaderboard(newScore) {
            const key = getDifficultyKey();
            let scores = getLeaderboard();
            
            // Add new score
            scores.push(newScore);
            
            // Sort descending and keep top 5
            scores.sort((a, b) => b - a);
            scores = scores.slice(0, 5);
            
            // Save back to localStorage
            localStorage.setItem(key, JSON.stringify(scores));
            
            // Update display
            displayLeaderboard();
        }
        
        function displayLeaderboard() {
            const scores = getLeaderboard();
            
            // Always create exactly 5 scores (fill with 0s)
            let displayScores = [...scores];
            while (displayScores.length < 5) {
                displayScores.push(0);
            }
            
            const topScoresElement = document.getElementById('topScoresList');
            topScoresElement.innerHTML = displayScores.map((score, index) => 
                `${index + 1}. ${score}`
            ).join('<br>');
        }        

        function updateLevelDisplay(score) {
            let level;
            if (score < 100) level = 1;
            else if (score < 300) level = 2;
            else if (score < 600) level = 3;
            else if (score < 900) level = 4;
            else level = 5;
            
            levelElement.textContent = level;
        }

        // Generate random food position, but check collision with snake
        function randomFood() {
            let validPosition = false;
            
            while (!validPosition) {
                food = {
                    x: Math.floor(Math.random() * tileCount),
                    y: Math.floor(Math.random() * tileCount)
                };
                
                // Check collision with SNAKE
                const collidesWithSnake = snake.some(segment => segment.x === food.x && segment.y === food.y);
                
                // Check collision with BAD FOOD
                const collidesWithBadFood = badFoodList.some(badFood => badFood.x === food.x && badFood.y === food.y);

                validPosition = !collidesWithSnake && !collidesWithBadFood;
            }
        }

        function randomBadFood() {
            const spawnChance = getGameDifficulty()
            
            if (Math.random() < spawnChance) {
                let validPosition = false;
                let newBadFood;
    
                while (!validPosition) {
                    newBadFood = {
                        x: Math.floor(Math.random() * tileCount),
                        y: Math.floor(Math.random() * tileCount)
                    };

                    const head = snake[0]; // Snake head position
                                
                    // No bad apple directly in fron of the snake with a 3-tile safety zone
                    const tooCloseToHead = Math.abs(newBadFood.x - head.x) <= 2 && 
                                           Math.abs(newBadFood.y - head.y) <= 2;
                    
                    // Check collision with SNAKE
                    const snakeCollision = snake.some(segment => segment.x === newBadFood.x && segment.y === newBadFood.y);

                    // Check collision with FOOD
                    const regularFoodCollision = food.x === newBadFood.x && food.y === newBadFood.y;

                    // Check collision with BAD FOOD
                    const badFoodCollision = badFoodList.some(badFood => badFood.x === newBadFood.x && badFood.y === newBadFood.y);

                    validPosition = !snakeCollision && !badFoodCollision && !regularFoodCollision && !tooCloseToHead;
                }
                
                if (validPosition) {
                    badFoodList.push(newBadFood);
                }
            }
        }
        
        // Draw game elements
        function drawGame() {
            // Clear canvas
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = '#0f3460';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // If game is not running, draw splash image and return
            if (!gameRunning && splashLoaded) {
                // Draw centered in the canvas; scale if needed
                const iw = splashImage.width;
                const ih = splashImage.height;
                const cw = canvas.width;
                const ch = canvas.height;
        
                const scale = Math.min(cw / iw, ch / ih); // fit inside canvas
                const dw = iw * scale;
                const dh = ih * scale;
                const dx = (cw - dw) / 2;
                const dy = (ch - dh) / 2;
        
                ctx.drawImage(splashImage, dx, dy, dw, dh);
                return;
            }

            // Draw food with stem
            ctx.fillStyle = '#ff0000';  // Red apple outline
            ctx.fillRect(food.x * gridSize + 2, food.y * gridSize + 4, gridSize - 4, gridSize - 6);
            
            ctx.fillStyle = '#B5514D';  // Red apple middle
            ctx.fillRect(food.x * gridSize + 2, food.y * gridSize + 4, gridSize - 6, gridSize - 8);
            
            ctx.fillStyle = '#2b1d0e';  // Dark brown stem
            ctx.fillRect(food.x * gridSize + 8, food.y * gridSize, 4, 4);
            
            ctx.fillStyle = '#32CD32';  // Lime green leaf
            ctx.fillRect(food.x * gridSize + 13, food.y * gridSize + 1, 3, 2);

            for (const badFood of badFoodList) {
                const px = badFood.x * gridSize;  // cache pixel X
                const py = badFood.y * gridSize;  // cache pixel Y
                
                // Draw bad food with stem
                ctx.fillStyle = '#B5514D';  // Moldy apple outline 
                ctx.fillRect(px + 2, py + 4, gridSize - 4, gridSize - 6);
                
                ctx.fillStyle = '#4A4428';  // Red apple middle 
                ctx.fillRect(px + 2, py + 4, gridSize - 6, gridSize - 8);
    
                ctx.fillStyle = '#292E26';  // Black moldy spots
                ctx.fillRect(px + 6, py + 6, 3, 3);
                ctx.fillRect(px + 12, py + 10, 2, 2);
                
                ctx.fillStyle = '#2b1d0e';  // Dark brown stem
                ctx.fillRect(px + 8, py, 4, 4);
                
                ctx.fillStyle = '#32CD32';  // Lime green leaf
                ctx.fillRect(px + 13, py + 1, 3, 2);
            }
            
            // Normal green for body
            ctx.fillStyle = '#ADDDBB';  
            for (let i = 1; i < snake.length; i++) {
                ctx.fillRect(snake[i].x * gridSize, snake[i].y * gridSize, gridSize - 2, gridSize - 2);
            }
            
            // Draw snake - darker head
            const headX = snake[0].x * gridSize
            const headY = snake[0].y * gridSize
            const headSize = gridSize - 2
            ctx.fillStyle = snake.length > 0 ? '#32A956' : '#ADDDBB';  // Darker green for head
            ctx.fillRect(headX, headY, headSize, headSize);

            // Draw two red eyes on head
            ctx.fillStyle = '#ff0000';  // Bright red eyes
            const eyeSize = 4;
            const eyeOffset = 4;
            
            // Left eye
            ctx.fillRect(headX + eyeOffset, headY + eyeOffset, eyeSize, eyeSize);
            // Right eye  
            ctx.fillRect(headX + headSize - eyeOffset - eyeSize, headY + eyeOffset, eyeSize, eyeSize);
            
            // White highlight on eyes for shine effect
            ctx.fillStyle = 'rgba(255, 255, 255, 0.6)';
            ctx.fillRect(headX + eyeOffset + 1, headY + eyeOffset + 1, 2, 2);
            ctx.fillRect(headX + headSize - eyeOffset - eyeSize + 1, headY + eyeOffset + 1, 2, 2);
        }

        // Update game state
        function update() {
            if (!gameRunning) return;

            // Get next direction from queue OR use current dx/dy
            let nextDx = dx;
            let nextDy = dy;
            if (inputQueue.length > 0) {
                const queued = inputQueue.shift();
                nextDx = queued.dx;
                nextDy = queued.dy;
            }

            // Don't move if no direction set
            if (nextDx === 0 && nextDy === 0) return;

            const head = {x: snake[0].x + nextDx, y: snake[0].y + nextDy};
            
            // Check wall collision
            if (head.x < 0 || head.x >= tileCount || head.y < 0 || head.y >= tileCount) {
                gameOver();
                return;
            }

            // Check self collision
            for (let segment of snake) {
                if (head.x === segment.x && head.y === segment.y) {
                    gameOver();
                    return;
                }
            }

            // Check bad food collision
            for (const badFood of badFoodList) {
                if (head.x === badFood.x && head.y === badFood.y) {
                    gameOver();
                    return;
                }
            }
            
            snake.unshift(head);

            dx = nextDx;
            dy = nextDy;
            
            // Check food collision
            if (head.x === food.x && head.y === food.y) {

                // Play sound
                if (soundToggle.checked) {
                    const gameOverSound = document.getElementById('foodEatingSound');
                    gameOverSound.currentTime = 0;  // Reset to start
                    gameOverSound.play().catch(e => console.log('Sound play failed:', e));
                }
                
                score += 10;
                scoreElement.textContent = score;
                updateLevelDisplay(score);
                
                gameSpeed = getGameSpeed(score);
                
                randomFood();
                randomBadFood();
                
            } else {
                snake.pop();
            }
        }

        // Adjust game speed
        function getGameSpeed(score) {
            // Beginner (0-100): Very forgiving
            if (score < 100) return 200 - (score * 0.5);  // 200→175ms
            
            // Novice (100-300): Noticeable speedup  
            else if (score < 300) return 175 - ((score-100) * 0.25); // 175→125ms
            
            // Intermediate (300-600): Tense
            else if (score < 600) return 125 - ((score-300) * 0.1);  // 125→95ms
            
            // Expert (600-900): Brutal
            else if (score < 900) return 95 - ((score-600) * 0.05);  // 95→80ms
            
            // God-tier (900+): Impossible for humans
            else return Math.max(50, 80 - ((score-900) * 0.02));     // 80→50ms
        }

        //Get game difficulty
        function getGameDifficulty() {
            const difficultySelect = document.getElementById('difficultySelect');
            console.log(difficultySelect.value)
            return parseFloat(difficultySelect.value);
        }
        
        // Game over
        function gameOver() {
            gameRunning = false;
            gameOverElement.style.visibility = 'visible';

            // Update leaderboard with FINAL score only
            updateLeaderboard(score);

            // Toggle difficulty selector to ON
            toggleDifficultySelector();

            // Play sound
            if (soundToggle.checked) {
                const gameOverSound = document.getElementById('gameOverSound');
                gameOverSound.currentTime = 0;  // Reset to start
                gameOverSound.play().catch(e => console.log('Sound play failed:', e));
            }
        }

        // Restart game
        function restart() {
            snake = [{x: 10, y: 10}];
            dx = 0;
            dy = 0;
            score = 0;
            scoreElement.textContent = score;
            updateLevelDisplay(score);
            gameOverElement.style.visibility = 'hidden';
            gameRunning = true;

            if (splashLoaded) {
                splashLoaded = false
            }
            
            // Toggle difficulty selector to ON
            toggleDifficultySelector();
            
            // Resets game speed to default
            gameSpeed = 150
            lastUpdateTime = 0

            badFoodList = [];
            randomFood();
            randomBadFood();
            // Reset the input queue
            inputQueue = [];
        }

        // Handle keyboard input
        document.addEventListener('keydown', (e) => {
            const LEFT = 37, UP = 38, RIGHT = 39, DOWN = 40, R = 82;
        
            // R key ONLY restarts when game over
            if (e.keyCode === R && !gameRunning) {
                restart();
                return; // Don't process direction change after restart
            }

            if (!gameRunning) return;
            
            // Decide what the "current" direction is for validation
            const lastDir = inputQueue.length > 0 ? inputQueue.at(-1) : { dx, dy };

            if (e.keyCode === LEFT  && lastDir.dx !== 1  && lastDir.dx !== -1)  { inputQueue.push({ dx: -1, dy: 0}); console.log("LEFT"); }
            if (e.keyCode === UP    && lastDir.dy !== 1  && lastDir.dy !== -1)  { inputQueue.push({dx: 0, dy: -1}); console.log("UP"); }
            if (e.keyCode === RIGHT && lastDir.dx !== -1 && lastDir.dx !== 1)   { inputQueue.push({dx: 1, dy: 0}); console.log("RIGHT"); }
            if (e.keyCode === DOWN  && lastDir.dy !== -1 && lastDir.dy !== 1)   { inputQueue.push({dx: 0, dy: 1}); console.log("DOWN"); }
        });

        // Handle touch screen input
        let touchStartX = 0;
        let touchStartY = 0;
        const minSwipeDistance = 20;

        canvas.addEventListener('touchstart', (e) => {
            e.preventDefault();
            touchStartX = e.touches[0].clientX;
            touchStartY = e.touches[0].clientY;
        }, { passive: false });

        // Resolve the swipe as soon as the finger has moved far enough to
        // tell direction, not on touchend - waiting for the finger to lift
        // stacks a full gesture's worth of delay (down, travel, lift) on
        // top of the travel itself, which is what actually made this feel
        // laggy next to keydown's instant response. After a turn triggers,
        // the reference point resets to wherever the finger is right now
        // (rather than a one-shot flag for the whole gesture), so a single
        // continuous drag can chain multiple turns - e.g. right then down
        // then left - without ever lifting the finger, the same way you'd
        // tap several arrow keys in a row. Pushed through the same
        // inputQueue keyboard uses (rather than writing dx/dy directly, as
        // this used to) so a swipe and a still-pending keyboard turn
        // resolve in the order they happened, not by whichever line of
        // code ran last.
        //
        // Only pushed when the resolved direction actually differs from
        // the current one - a single long drag fires touchmove many times
        // and keeps re-crossing the 20px threshold in the *same* direction
        // as it goes, and the queue only drains one entry per game tick, so
        // without this check a long swipe piles up a backlog of redundant
        // same-direction entries that the snake visibly lags behind while
        // it works through.
        canvas.addEventListener('touchmove', (e) => {
            e.preventDefault();
            if (!gameRunning) return;

            const touchX = e.touches[0].clientX;
            const touchY = e.touches[0].clientY;
            const deltaX = touchX - touchStartX;
            const deltaY = touchY - touchStartY;
            const lastDir = inputQueue.length > 0 ? inputQueue.at(-1) : { dx, dy };
            let turned = true;
            let newDir = null;

            if (Math.abs(deltaX) > Math.abs(deltaY) && Math.abs(deltaX) > minSwipeDistance) {
                if (deltaX > 0 && lastDir.dx !== -1) newDir = { dx: 1, dy: 0 };  // Right
                else if (deltaX < 0 && lastDir.dx !== 1) newDir = { dx: -1, dy: 0 };  // Left
                else turned = false;
            } else if (Math.abs(deltaY) > minSwipeDistance) {
                if (deltaY > 0 && lastDir.dy !== -1) newDir = { dx: 0, dy: 1 };  // Down
                else if (deltaY < 0 && lastDir.dy !== 1) newDir = { dx: 0, dy: -1 };  // Up
                else turned = false;
            } else {
                turned = false;
            }

            if (newDir && (newDir.dx !== lastDir.dx || newDir.dy !== lastDir.dy)) {
                inputQueue.push(newDir);
            }

            if (turned) {
                touchStartX = touchX;
                touchStartY = touchY;
            }
        }, { passive: false });

        canvas.addEventListener('touchend', (e) => {
            e.preventDefault();

            // Double-tap to restart
            if (!gameRunning) {
                const now = new Date().getTime();
                const tapLength = now - lastTap;

                if (tapLength < doubleTapDelay && tapLength > 0) {
                    restart();
                    return;
                }
                lastTap = now;
                return;
            }
        }, { passive: false });
        
        // Game loop
        function gameLoop(time) {
            // Only update game logic when enough time passed
            if (time - lastUpdateTime >= gameSpeed) {
                update();
                needsRedraw = true; // Only redraw after logic update
                lastUpdateTime = time;  // Reset timer
            }

            if (needsRedraw) {
                drawGame();
                needsRedraw = false;
            }
            
            requestAnimationFrame(gameLoop);
        }

        // Initialize and start
        updateDifficultyDisplay();
        displayLeaderboard();
        requestAnimationFrame(gameLoop);
    </script>
</body>
</html>
